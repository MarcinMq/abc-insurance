services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: abc_insurance
      POSTGRES_USER: abc_user
      POSTGRES_PASSWORD: abc_password_2024
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abc_user -d abc_insurance"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      SECRET_KEY: change-this-in-production
      DEBUG: "False"
      DB_NAME: abc_insurance
      DB_USER: abc_user
      DB_PASSWORD: abc_password_2024
      DB_HOST: db
      DB_PORT: "5432"
      CORS_ALLOWED_ORIGINS: http://localhost
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
