services:
  db:
    image: postgres:15-alpine
    container_name: abc_insurance_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: abc_insurance
      POSTGRES_USER: abc_user
      POSTGRES_PASSWORD: abc_password_2024
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abc_user -d abc_insurance"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: abc_insurance_backend
    volumes:
      - ./backend:/app
      - media_files:/app/media
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-dev-secret-key-change-in-production
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend
      - CORS_ALLOWED_ORIGINS=http://localhost:4200
      - DB_NAME=abc_insurance
      - DB_USER=abc_user
      - DB_PASSWORD=abc_password_2024
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py makemigrations users policies claims notifications &&
             python manage.py migrate &&
             python manage.py loaddata fixtures/initial_data.json &&
             python manage.py runserver 0.0.0.0:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: abc_insurance_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "4200:4200"
    environment:
      - NODE_ENV=development
    depends_on:
      - backend
    command: sh -c "npm install && ./node_modules/.bin/ng serve --host 0.0.0.0 --poll 10000 --no-live-reload"

volumes:
  postgres_data:
  media_files:
